name: Meross-Verlauf nachtragen (Datenloch schliessen)

# Bewusst NUR manuell ausloesbar (workflow_dispatch) - das ist ein Einmal-Werkzeug
# fuer den Fall einer Luecke (z.B. nach einer Meross-Sperre), kein Dauerbetrieb.
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Erster nachzutragender Tag (YYYY-MM-DD)"
        required: true
      end_date:
        description: "Letzter nachzutragender Tag (YYYY-MM-DD, leer = gleich wie Start)"
        required: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Tages-Verbrauch von Meross abrufen und in historical-solar-*.csv eintragen
        env:
          MEROSS_EMAIL: ${{ secrets.MEROSS_EMAIL }}
          MEROSS_PASSWORD: ${{ secrets.MEROSS_PASSWORD }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: python backfill_meross_history.py

      - name: Aenderungen committen und pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historical-solar-garage.csv historical-solar-garten.csv
          if git diff --cached --quiet; then
            echo "Keine Aenderungen an den historical-solar-*.csv Dateien - nichts zu committen."
          else
            git commit -m "Datenloch nachgetragen: ${{ inputs.start_date }} bis ${{ inputs.end_date || inputs.start_date }}"
            git push
          fi
