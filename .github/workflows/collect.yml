name: Meross-Ertrag erfassen

on:
  schedule:
    # alle 5 Minuten - das ist das kleinste Intervall, das GitHub fuer zeitgesteuerte
    # Actions ueberhaupt erlaubt. GitHub garantiert keine exakte Punktlandung,
    # bei viel Last auf GitHub-Seite kann es ein paar Minuten spaeter laufen.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # erlaubt manuelles Starten über den "Actions"-Tab, z. B. für den ersten Test

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Meross abfragen und in Google-Tabelle schreiben
        env:
          MEROSS_EMAIL: ${{ secrets.MEROSS_EMAIL }}
          MEROSS_PASSWORD: ${{ secrets.MEROSS_PASSWORD }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python collect_meross.py
